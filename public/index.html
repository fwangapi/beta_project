<!doctype html>
<html lang="en">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beta Journal</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1e293b; background: #f8fafc; }
      * { box-sizing: border-box; } body { margin: 0; }
      main { max-width: 920px; margin: auto; padding: 32px 16px 64px; }
      h1 { margin-bottom: 4px; } h2 { font-size: 1.15rem; margin-top: 0; }
      .muted { color: #64748b; line-height: 1.5; }
      .panel, article { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-top: 20px; }
      label { display: block; font-weight: 650; font-size: .9rem; margin: 14px 0 6px; }
      input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; padding: 10px; font: inherit; }
      textarea { min-height: 100px; resize: vertical; } button { border: 0; border-radius: 7px; padding: 9px 13px; font: inherit; font-weight: 650; cursor: pointer; background: #2563eb; color: white; }
      button.secondary { color: #1e40af; background: #e0e7ff; } button.danger { color: #b91c1c; background: #fee2e2; }
      .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; } .hidden { display: none; }
      .error { color: #b91c1c; } .success { color: #15803d; } .entry-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
      .entry-head h2 { margin-bottom: 3px; } .entry-content { white-space: pre-wrap; line-height: 1.55; }
      .tag { display: inline-block; background: #e0e7ff; color: #3730a3; border-radius: 999px; padding: 3px 8px; margin: 2px 4px 0 0; font-size: .8rem; }
      #search { margin-top: 16px; } @media (max-width: 560px) { .entry-head { display: block; } }
    </style>

  </head>
  <body>
    <main>
      <h1>My AI Journal</h1>
      <p class="muted">Convert Youtube transcripts to ai summary title and tags.</p>

      <section class="panel">
        <h2 id="form-heading">New journal entry</h2>


        <form id="journal-form">

          <!-- New YouTube quick-import bar -->
          <label for="yt-url">Import directly from YouTube</label>
          <div style="display: flex; gap: 8px;">
          <input id="yt-url" placeholder="https://www.youtube.com/watch?v=...">
          <button id="yt-fetch-btn" type="button" class="secondary" style="white-space: nowrap;">
        📥 Fetch Transcript
          </button>
          </div>


          <label for="raw-content">Paste article or transcript</label>
          <textarea id="raw-content" placeholder="Paste the full article or transcript here..."></textarea>

          <button id="ai-analyze" type="button" class="secondary" style="margin: 10px 0; width: 100%;">
            ✨ Suggest Title, Summary & Tags
          </button>
          <p role="status" aria-live="polite" id="ai-status" class="muted" style="font-size: 0.85rem; min-height: 20px;"></p>

          <label for="title">Title</label>
          <input id="title" required placeholder="A brief thought worth remembering">

          <label for="content">Summary and notes</label>
          <textarea id="content" required placeholder="Write the important ideas in your own words…"></textarea>

          <label for="source">Source</label>
          <input id="source" required placeholder="Article URL, podcast episode, or publication name">

          <label for="tags">Tags</label>
          <input id="tags" placeholder="e.g. health, ai_infra, energy, ai_algo, semi, network">
          <p class="muted">Separate tags with commas.</p>
          <div class="actions"><button id="save" type="submit">Save entry</button><button id="cancel" class="secondary hidden" type="button">Cancel edit</button><span id="message" role="status"></span></div>
        </form>
      </section>

      <input id="search" placeholder="Search tags, e.g. sqlite">
      <section id="entries" aria-live="polite"></section>
    </main>

    <script>
      // Define helpers BEFORE registering event handlers.
      const byId = id => document.getElementById(id);
      let accessCode = ''; // Keep the password in memory, not persistent storage.
      try { localStorage.removeItem('journal_access_code'); } catch {}

      async function request(path, options = {}, allowPrompt = false) {
        if (location.protocol === 'file:') throw new Error('Open http://localhost:3000 after starting the Node server.');
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 100000);
        let res;
        try {
          res = await fetch(path, { ...options, signal: controller.signal,
            headers: { 'Content-Type': 'application/json', ...options.headers,
              ...(accessCode ? { 'x-access-code': accessCode } : {}) } });
        } catch (error) {
          throw new Error(error.name === 'AbortError' ? 'Request timed out. Try again later.' : 'Cannot reach the server. Check that it is running.');
        } finally { clearTimeout(timer); }
        if (res.status === 401) {
          accessCode = '';
          if (allowPrompt) {
            const entered = prompt('🔒 Enter the application password:');
            if (!entered) throw new Error('Cancelled. No AI request was authorized.');
            accessCode = entered;
            return request(path, options, false);
          }
        }
        if (res.status === 204) return null;
        let data;
        try { data = await res.json(); }
        catch { throw new Error(`Server returned HTTP ${res.status} without JSON. Check the server URL and logs.`); }
        if (!res.ok) throw new Error(data.error || `Request failed (HTTP ${res.status}).`);
        return data;
      }

      // ==========================================
      // 🎬 YouTube Fetch 按钮逻辑
      // ==========================================
      byId('yt-fetch-btn').addEventListener('click', async () => {
        const url = byId('yt-url').value.trim();
        const status = byId('ai-status');

        if (!url) {
          status.textContent = 'Please enter a YouTube link first.';
          status.className = 'muted error';
          return;
        }

        byId('yt-fetch-btn').disabled = true;
        status.textContent = '⏳ Pulling transcript from YouTube...';
        status.className = 'muted';

        try {
          const data = await request('/api/transcript', {
            method: 'POST', body: JSON.stringify({ url })
          }, false);

          byId('raw-content').value = data.transcript;
          byId('source').value = url;
          status.textContent = '✅ Transcript loaded! Now click "Suggest Title, Summary & Tags".';
          status.className = 'muted success';
        } catch (err) {
          status.textContent = '❌ ' + err.message;
          status.className = 'muted error';
        } finally {
          byId('yt-fetch-btn').disabled = false;
        }
      });

      // ==========================================
      // 🤖 AI Analyze 按钮逻辑
      // ==========================================
      byId('ai-analyze').addEventListener('click', async () => {
        const content = byId('raw-content').value;
        const status = byId('ai-status');

        if (content.length < 20) {
          status.textContent = 'Please paste more content first.';
          status.className = 'muted error';
          return;
        }

        byId('ai-analyze').disabled = true;
        status.textContent = '🤖 AI is thinking...';
        status.className = 'muted';

        try {
          const data = await request('/api/analyze', {
            method: 'POST', body: JSON.stringify({ content })
          }, true);

          if (data.title) byId('title').value = data.title;
          if (data.summary) byId('content').value = data.summary;
          if (data.tags) byId('tags').value = data.tags.join(', ');

          status.textContent = '✅ Done! Review and edit before saving.';
          status.className = 'muted success';
        } catch (e) {
          status.textContent = '❌ ' + e.message;
          status.className = 'muted error';
        } finally {
          byId('ai-analyze').disabled = false;
        }
      });
      let editingId = null;
      let loadSequence = 0;
      function message(text, error = false) {
        byId('message').textContent = text;
        byId('message').className = error ? 'error' : 'success';
      }
      function resetForm() {
        editingId = null;
        byId('journal-form').reset();
        byId('form-heading').textContent = 'New journal entry';
        byId('cancel').classList.add('hidden');
        byId('ai-status').textContent = '';
      }
      function element(tag, text, className) {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        return node;
      }
      async function loadEntries() {
        const sequence = ++loadSequence;
        try {
          const entries = await request('/api/journals?search=' + encodeURIComponent(byId('search').value));
          if (sequence !== loadSequence) return;
          byId('entries').replaceChildren();
          for (const entry of entries) {
            const article = document.createElement('article');
            article.append(element('h2', entry.title), element('p', entry.source, 'muted'),
              element('div', entry.content, 'entry-content'));
            for (const tag of entry.tags) article.append(element('span', tag, 'tag'));
            const actions = element('div', '', 'actions');
            const edit = element('button', 'Edit', 'secondary');
            edit.type = 'button';
            edit.onclick = () => {
              editingId = entry.id;
              for (const name of ['title', 'content', 'source']) byId(name).value = entry[name];
              byId('tags').value = entry.tags.join(', ');
              byId('form-heading').textContent = 'Edit journal entry';
              byId('cancel').classList.remove('hidden');
              byId('title').focus();
            };
            const remove = element('button', 'Delete', 'danger');
            remove.type = 'button';
            remove.onclick = async () => {
              if (!confirm('Delete this journal entry?')) return;
              try {
                await request('/api/journals/' + entry.id, { method: 'DELETE' });
                if (editingId === entry.id) resetForm();
                await loadEntries();
              } catch (error) { message(error.message, true); }
            };
            actions.append(edit, remove); article.append(actions);
            byId('entries').append(article);
          }
        } catch (error) { if (sequence === loadSequence) message(error.message, true); }
      }
      byId('journal-form').addEventListener('submit', async event => {
        event.preventDefault();
        byId('save').disabled = true;
        try {
          const body = {};
          for (const name of ['title', 'content', 'source']) body[name] = byId(name).value.trim();
          body.tags = byId('tags').value.split(',').map(tag => tag.trim()).filter(Boolean);
          await request('/api/journals' + (editingId === null ? '' : '/' + editingId), {
            method: editingId === null ? 'POST' : 'PUT', body: JSON.stringify(body)
          });
          resetForm(); message('Saved.'); await loadEntries();
        } catch (error) { message(error.message, true); }
        finally { byId('save').disabled = false; }
      });
      byId('cancel').addEventListener('click', resetForm);
      byId('search').addEventListener('input', loadEntries);
      loadEntries();
    </script>

  </body>
</html>
